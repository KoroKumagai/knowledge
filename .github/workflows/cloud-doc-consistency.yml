name: Validate cloud comparison consistency

on:
  pull_request:
    paths:
      - "cloud/**"
      - "scripts/check_cloud_consistency.py"
      - "scripts/check_cloudflare_catalog.py"
      - "scripts/check_aws_service_catalog.py"
      - "scripts/check_aws_marketing_products.py"
      - "scripts/render_aws_open_items.py"
      - "scripts/check_aws_audit_decisions.py"
      - "scripts/probe_aws_ssm_regions.py"
      - ".github/workflows/probe-aws-ssm-regions.yml"
      - "scripts/refresh_aws_marketing_products.py"
      - ".github/workflows/refresh-aws-marketing-products.yml"
      - "scripts/refresh_aws_service_catalog.py"
      - ".github/workflows/refresh-aws-service-catalog.yml"
      - "scripts/refresh_cloudflare_directory.py"
      - ".github/workflows/refresh-cloudflare-directory.yml"
      - ".github/workflows/cloud-doc-consistency.yml"
  push:
    paths:
      - "cloud/**"
      - "scripts/check_cloud_consistency.py"
      - "scripts/check_cloudflare_catalog.py"
      - "scripts/check_aws_service_catalog.py"
      - "scripts/check_aws_marketing_products.py"
      - "scripts/render_aws_open_items.py"
      - "scripts/check_aws_audit_decisions.py"
      - "scripts/probe_aws_ssm_regions.py"
      - ".github/workflows/probe-aws-ssm-regions.yml"
      - "scripts/refresh_aws_marketing_products.py"
      - ".github/workflows/refresh-aws-marketing-products.yml"
      - "scripts/refresh_aws_service_catalog.py"
      - ".github/workflows/refresh-aws-service-catalog.yml"
      - "scripts/refresh_cloudflare_directory.py"
      - ".github/workflows/refresh-cloudflare-directory.yml"
      - ".github/workflows/cloud-doc-consistency.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tables, moved products, excluded features, and counts
        run: python scripts/check_cloud_consistency.py
      - name: Syntax-check snapshot generator and validators
        run: |
          python -m py_compile scripts/refresh_cloudflare_directory.py
          python -m py_compile scripts/check_cloudflare_catalog.py
          python -m py_compile scripts/refresh_aws_service_catalog.py
          python -m py_compile scripts/check_aws_service_catalog.py
          python -m py_compile scripts/refresh_aws_marketing_products.py
          python -m py_compile scripts/check_aws_marketing_products.py
          python -m py_compile scripts/render_aws_open_items.py
          python -m py_compile scripts/check_aws_audit_decisions.py
          python -m py_compile scripts/probe_aws_ssm_regions.py
          python -m py_compile scripts/check_cloud_consistency.py
      - name: Validate Cloudflare official catalogs
        run: python scripts/check_cloudflare_catalog.py
      - name: Validate AWS General Reference and lifecycle catalogs
        run: python scripts/check_aws_service_catalog.py
      - name: Validate complete AWS marketing Products and 269-reference diff
        run: python scripts/check_aws_marketing_products.py
      - name: Validate every unresolved AWS item and evidence-backed availability claim
        run: python scripts/render_aws_open_items.py --check
      - name: Regression test that child feature shutdown does not retire service
        run: python scripts/check_aws_audit_decisions.py --self-test-retirement
      - name: Validate all AWS availability decisions and source freshness
        run: python scripts/check_aws_audit_decisions.py --check
      - name: Verify expired evidence warns without failing CI
        run: python scripts/check_aws_audit_decisions.py --as-of 2027-06-01 --quiet-warnings
      - name: Test SSM public parameter pagination without AWS credentials
        run: python scripts/probe_aws_ssm_regions.py --self-test
