name: Bootstrap reviewed AWS Products lifecycle changes (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/bootstrap-aws-products-review.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'docs/aws-marketing-products-audit-20261115'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate official Products tables from current source
        run: |
          python -m py_compile scripts/refresh_aws_marketing_products.py scripts/check_aws_marketing_products.py
          python scripts/refresh_aws_marketing_products.py
          python scripts/check_aws_marketing_products.py
          python scripts/check_aws_service_catalog.py
          python scripts/check_cloud_consistency.py
          python scripts/check_cloudflare_catalog.py
      - name: Commit verified snapshot to PR branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud/aws/products-source.json cloud/aws/products.md cloud/aws/products-coverage.md cloud/aws/README.md cloud/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(aws): rebuild lifecycle-aware official Products tables'
            git push origin HEAD:refs/heads/docs/aws-marketing-products-audit-20261115
          fi
