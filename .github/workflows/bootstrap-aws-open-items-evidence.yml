name: Refresh AWS open-item evidence for review (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/bootstrap-aws-open-items-evidence.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'docs/aws-open-items-availability-audit-20261115'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild and check source-provenance inventory
        run: |
          python -m py_compile scripts/render_aws_open_items.py
          python scripts/render_aws_open_items.py --write
          python scripts/render_aws_open_items.py --check
          python scripts/check_aws_marketing_products.py
          python scripts/check_aws_service_catalog.py
      - name: Commit regenerated Markdown into review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud/aws/open-items.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(aws): refresh eight verified service evidence records'
            git push origin HEAD:refs/heads/docs/aws-open-items-availability-audit-20261115
          fi
