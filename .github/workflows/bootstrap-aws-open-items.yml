name: Bootstrap AWS unresolved item audit snapshot (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/bootstrap-aws-open-items.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'docs/aws-open-items-availability-audit-20261115'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and re-check complete AWS unresolved audit
        run: |
          python -m py_compile scripts/render_aws_open_items.py
          python scripts/render_aws_open_items.py --write
          python scripts/render_aws_open_items.py --check
      - name: Publish evidence matrix to PR branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud/aws/open-items.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(aws): render all 128 unresolved item checks'
            git push origin HEAD:refs/heads/docs/aws-open-items-availability-audit-20261115
          fi
