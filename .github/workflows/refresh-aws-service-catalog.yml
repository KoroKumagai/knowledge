name: Propose AWS official service catalog refresh

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aws-official-catalog-refresh
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AWS directory parser
        run: python -m pip install beautifulsoup4
      - name: Generate official AWS reference and lifecycle snapshots
        run: python scripts/refresh_aws_service_catalog.py
      - name: Validate BEFORE opening review pull request
        run: |
          python -m py_compile scripts/refresh_aws_service_catalog.py scripts/check_aws_service_catalog.py
          python scripts/check_aws_service_catalog.py
          python scripts/check_cloud_consistency.py
          python scripts/check_cloudflare_catalog.py
      # GITHUB_TOKEN-created PRs do not trigger other PR workflows.
      # The validations above are mandatory, and PR review is still required.
      - name: Propose changes for human review (never push directly to main)
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/aws-official-service-catalog
          delete-branch: true
          add-paths: |
            cloud/aws/catalog.md
            cloud/aws/lifecycle.md
            cloud/aws/coverage.md
            cloud/aws/README.md
            cloud/README.md
          commit-message: "docs(aws): refresh official endpoint and lifecycle snapshots"
          title: "docs(aws): refresh AWS official service inventory"
          body: |
            This PR refreshes AWS General Reference endpoint/quota listings and
            Maintenance, Sunset, and Full Shutdown records.
            It is a review proposal, not an automatic merge.
            Checks ran in the proposing workflow before PR creation.
            Verify service names, lifecycle category changes, and coverage.
            The index is not an exhaustive marketing-products catalog.
