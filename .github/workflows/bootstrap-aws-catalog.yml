name: Bootstrap AWS official catalog snapshot (temporary review branch only)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'docs/aws-official-service-audit-20261114'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Generate from AWS General Reference
        run: python scripts/refresh_aws_service_catalog.py
      - name: Commit generated evidence to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud/aws/
          if ! git diff --cached --quiet; then
            git commit -m 'docs(aws): snapshot AWS official catalogs'
            git push origin HEAD:refs/heads/docs/aws-official-service-audit-20261114
          fi
