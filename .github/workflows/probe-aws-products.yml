name: Probe AWS Products marketing catalog (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/probe-aws-products.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium for source discovery
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Inspect official AWS Products component network
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          urls=[]
          def record(response):
              url=response.url
              if any(k in url.lower() for k in ("directory","search","api/","products","cards","graphql","query")):
                  ct=response.headers.get("content-type","")
                  urls.append((response.status,ct,url))
                  print("NET",response.status,ct[:65],url[:310])
                  if any(k in ct for k in ("json","graphql")) and len(urls)<80:
                      try:
                          obj=response.json()
                          if isinstance(obj,dict):
                              print("NET_JSON_KEYS",list(obj)[:22])
                              print("NET_JSON_PREVIEW",repr(str(obj)[:650]))
                      except Exception: pass
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--no-sandbox"])
              page=browser.new_page(viewport={"width":1440,"height":900},locale="en-US")
              page.on("response",record)
              page.goto("https://aws.amazon.com/products/?nc2=h_prod",wait_until="domcontentloaded",timeout=55000)
              page.wait_for_timeout(15000)
              print("TITLE",page.title())
              print("BODY TEXT START",repr(page.locator("body").inner_text()[:1100]))
              print("DISPLAYING",re.findall(r"Displaying[^\\n]{0,110}",page.locator("body").inner_text())[:8])
              print("BUTTONS",page.get_by_role("button").all_text_contents()[:45])
              print("INPUTS",page.locator("input").evaluate_all("(els)=>els.map(x=>[x.placeholder,x.id,x.type])")[:15])
              print("NETWORK MATCHES",len(urls))
              browser.close()
          PY
