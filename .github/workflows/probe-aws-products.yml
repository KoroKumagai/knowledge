name: Probe AWS Products marketing catalog (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/probe-aws-products.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect AWS official Products API totals and pagination
        run: |
          python -m pip install requests
          python - <<'PY'
          import requests
          url="https://aws.amazon.com/api/dirs/items/search"
          base={"item.directoryId":"products-cards-interactive-aws-products-ams","item.locale":"en_US","tags.id":"GLOBAL#local-tags-aws-products-type#service","sort_by":"item.additionalFields.title","sort_order":"asc"}
          for size in (1,15,100,500):
              r=requests.get(url,params={**base,"size":size},headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"},timeout=40)
              print("SAMPLE",size,r.status_code,"BYTES",len(r.content),"URL",r.url[:270])
              r.raise_for_status()
              obj=r.json()
              print("META",repr(obj.get("metadata"))[:3500])
              items=obj.get("items",[])
              print("ITEMCOUNT",len(items),"FIRST",repr(items[0] if items else None)[:1800],"LAST",repr(items[-1] if items else None)[:1100])
          PY
