name: Probe AWS Products marketing catalog (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/probe-aws-products.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect official AWS Products HTML and search config
        run: |
          python -m pip install requests beautifulsoup4
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          url="https://aws.amazon.com/products/?nc2=h_prod"
          try:
              r=requests.get(url,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36","Accept-Language":"en-US,en;q=0.9"},timeout=35)
              print("HTTP",r.status_code,"bytes",len(r.content),"final",r.url)
              html=r.text
              for term in ("aws-products-all","Search All AWS Products","productNameLowercase","data-awsui","amazon-cloudsearch","searchApi","react-search","AWS App Studio"):
                  print("LOOKUP",term,"count",html.lower().count(term.lower()))
                  for m in list(re.finditer(re.escape(term),html,re.I))[:2]:
                      print("CONTEXT",term,repr(html[max(0,m.start()-300):m.end()+350])[:730])
              soup=BeautifulSoup(html,"html.parser")
              print("SCRIPTS",len(soup.find_all("script")))
              for s in soup.find_all("script"):
                  src=s.get("src")
                  if src and any(k in src.lower() for k in ["search","product","cloud","assets","global"]):
                      print("SCRIPT",src[:240])
              print("DOM_IDS",[(t.name,t.get("id"),str(t.get("class",""))[:100]) for t in soup.select("[id]") if any(x in (t.get("id") or "").lower() for x in ["aws","search","product","filter"])][:55])
          except Exception as e:
              print("PROBE ERROR",type(e).__name__,str(e)[:300]);raise
          PY
