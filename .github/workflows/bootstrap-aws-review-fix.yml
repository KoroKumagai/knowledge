name: Bootstrap AWS audit follow-up (temporary)
on:
  pull_request:
    paths:
      - .github/workflows/bootstrap-aws-review-fix.yml
permissions:
  contents: write
jobs:
  regen:
    if: github.head_ref == 'docs/aws-open-items-availability-audit-20261115'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate reviewed source-aligned AWS Markdown and check
        run: |
          python -m py_compile scripts/render_aws_open_items.py
          python scripts/render_aws_open_items.py --write
          python scripts/render_aws_open_items.py --check
          python scripts/check_aws_service_catalog.py
          python scripts/check_aws_marketing_products.py
          python scripts/check_cloudflare_catalog.py
          python scripts/check_cloud_consistency.py
      - name: Publish regenerated Markdown to review PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud/aws/open-items.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(aws): regenerate open items with Q/Glacier lifecycle corrections'
            git push origin HEAD:refs/heads/docs/aws-open-items-availability-audit-20261115
          fi
